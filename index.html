<!doctype html>
<html lang="en">
  <head>
	<meta charset="utf-8" />
	<meta http-equiv="refresh" content="0; url=/portfolio/" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Redirecting…</title>
	<link rel="canonical" href="https://jon-bown.github.io/portfolio/" />
	<script>
	  // Immediate JS redirect as a fallback for clients that ignore meta-refresh
	  window.location.replace('/portfolio/');
	</script>
  </head>
  <body>
	<p>If you are not redirected automatically, <a href="/portfolio/">click here to go to /portfolio/</a>.</p>
  </body>
</html>
